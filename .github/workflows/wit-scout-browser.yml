name: Scout rendered review
on:
  pull_request:
    paths:
      - "experiments/wit-scout-explain/context-review/**"
      - ".github/workflows/wit-scout-browser.yml"
permissions:
  contents: read
jobs:
  rendered-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise both offline reports in Chrome
        working-directory: experiments/wit-scout-explain/context-review
        run: python3 check_browser.py
